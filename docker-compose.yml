services:
  tracker:
    build: .
    container_name: p2ptracker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/p2ptracker.db
      TZ: Asia/Yangon
    volumes:
      - ./data:/app/data
    ports:
      # Localhost-only by default (use an SSH tunnel). Set BIND_ADDR=0.0.0.0 in .env to expose
      # the dashboard publicly — only together with DASHBOARD_USER/DASHBOARD_PASS.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
